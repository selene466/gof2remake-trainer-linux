[tools]
go = "1.27.4"

[tasks.build]
description = "build dist/gof2remake-trainer"
run = "go build -trimpath -o dist/gof2remake-trainer ./cmd/gof2remake-trainer"

[tasks.vet]
run = "go vet ./..."

[tasks.install-local]
description = "build and install to ~/.local/bin (mise run install-local)"
depends = ["build"]
run = "install -Dm755 dist/gof2remake-trainer ~/.local/bin/gof2remake-trainer"

[tasks.clean]
run = "rm -rf dist"
